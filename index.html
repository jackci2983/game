<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Soccer Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    #gameCanvas {
      display: block;
      margin: auto;
      background: #1e272e;
      border: 5px solid #00ffcc;
      border-radius: 20px;
      box-shadow: 0 0 30px #00ffcc;
    }

    .scoreboard {
      text-align: center;
      font-size: 1.5em;
      margin-top: 15px;
      letter-spacing: 1px;
    }

    .instructions {
      text-align: center;
      font-size: 1em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="scoreboard">Score: <span id="score">0</span></div>
  <div class="instructions">Move: ← → | Shoot: SPACE</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');

    // Player
    const player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 60,
      width: 50,
      height: 50,
      color: '#00ffcc',
      speed: 8
    };

    // Ball
    let ball = null;
    const ballSpeed = 10;

    // Goal
    const goal = {
      x: Math.random() * (canvas.width - 100),
      y: 50,
      width: 100,
      height: 30,
      color: '#ff4757',
      direction: 1,
      speed: 5
    };

    let score = 0;
    let keys = {};

    document.addEventListener('keydown', (e) => keys[e.key] = true);
    document.addEventListener('keyup', (e) => keys[e.key] = false);

    function update() {
      // Move player
      if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
      if (keys['ArrowRight'] && player.x + player.width < canvas.width) player.x += player.speed;

      // Shoot
      if (keys[' '] && !ball) {
        ball = { x: player.x + player.width / 2 - 5, y: player.y, radius: 6 };
      }

      // Move ball
      if (ball) {
        ball.y -= ballSpeed;
        if (ball.y < 0) ball = null;
      }

      // Move goal
      goal.x += goal.speed * goal.direction;
      if (goal.x <= 0 || goal.x + goal.width >= canvas.width) {
        goal.direction *= -1;
      }

      // Collision detection
      if (ball &&
          ball.x > goal.x &&
          ball.x < goal.x + goal.width &&
          ball.y > goal.y &&
          ball.y < goal.y + goal.height) {
        score++;
        scoreDisplay.textContent = score;
        ball = null;

        // Flash goal
        goal.color = '#2ed573';
        setTimeout(() => goal.color = '#ff4757', 200);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Draw goal
      ctx.fillStyle = goal.color;
      ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

      // Draw ball
      if (ball) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.closePath();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
